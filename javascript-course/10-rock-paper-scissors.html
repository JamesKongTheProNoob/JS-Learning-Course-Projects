<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles/10-rock-paper-scissors.css">
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>
    <button class="move-button" onclick="
       playGame('rock');
    "><img src="images/rock-emoji.png" class="move-icon"></button>
    <button class="move-button" onclick="
      playGame('paper');
    "><img src="images/paper-emoji.png" class="move-icon"></button>
    <button class="move-button" onclick="
      playGame('scissor');
    "><img src="images/scissor-emoji.png" class="move-icon"></button>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-scores score"></p>
    <button onclick="
      score.win=0;
      score.losses=0;
      score.tie=0;
      //these change the current score of the current game before refresh
      localStorage.removeItem('score');
      ///this line changes the stored score of the game, it is needed as playGame is not called here and there is no alteration to the stored score if this line is not implemented
      updateScoreElement()
    " class="reset-score-button">Reset Score</button>
    <script src="scripts/10-rock-paper-scissors.js">
      //seperates Js into its own file
    </script>
  </body>
</html>
