<!DOCTYPE html>
<html>
  <head>
    <title>DOM Projects</title>
    <style>
      .gaming{
        background-color:lightgray;
        color:black;
        border-radius:5px;
        padding:5px 10px;
        border-color: transparent;
      }
      .is-toggled{
        background-color:black;
        color:white;
        cursor:pointer;
      }
    </style>
  <body>
     <button class="gaming" onmousedown="
      document.querySelector('.gaming').classList.contains('is-toggled')?document.querySelector('.gaming').classList.add('is-toggled'):document.querySelector('.gaming').classList.remove('is-toggled')">Gaming</button>
    <script>

    </script>
  </body>
</html>
