<!DOCTYPE html>
<html>
  <head>
    <title>Arrays and Loops</title>
    <style>

    </style>
  </head>
  <body>
    <script>
      const array=[1,2,3]
      function addOne(array){
        for(let i=0;i<array.length;i++){
          array[i]+=1
        }
        return array;
      }
      console.log(addOne(array));
      console.log(addOne([-2,-1,0,99]))
    </script>
  </body>
</html>
