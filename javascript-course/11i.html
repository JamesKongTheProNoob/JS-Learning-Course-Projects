<!DOCTYPE html>
<html>
  <head>
    <title>Arrays and Loops</title>
    <style>

    </style>
  </head>
  <body>
    <script>
      const array=[1,2,3]
      function addNum(array,num){
        for(let i=0;i<array.length;i++){
          array[i]+=num
        }
        return array;
      }
      console.log(addNum(array,2));
      console.log(addNum([-2,-1,0,99],2));
      console.log(addNum(array,3));
    </script>
  </body>
</html>
