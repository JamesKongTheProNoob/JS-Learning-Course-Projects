<!DOCTYPE html>
<html>
  <head>
    <title>Arrays and Loops</title>
    <style>

    </style>
  </head>
  <body>
    <script>
     function countPositive(nums){
      let i = 0;
      let num = 0
        while(i<nums.length){
          if(nums[i]>0){
            num++;
          }
          i++
        }
      return num
     }
     console.log(countPositive([1,-3,5]))
     console.log(countPositive([-2,3,,-5,7,10]))
    </script>
  </body>
</html>
