<!DOCTYPE html>
<html>
  <head>
    <title>Arrays and Loops</title>
    <style>

    </style>
  </head>
  <body>
    <script>
      let array1=['green','red','blue','red']
      let array2=['green','red','blue','red']
      function findIndex(array,word){
        for(let i=0;i<array.length;i++){
          if(array[i]===word){
            return i
          }
        }
        return -1
      }
      console.log(findIndex(array1,'red'))
      console.log(findIndex(array2,'yellow'))
    </script>
  </body>
</html>
