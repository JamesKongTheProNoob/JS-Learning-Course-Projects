<!DOCTYPE html>
<html>
  <head>
    <title>Arrays and Loops</title>
    <style>

    </style>
  </head>
  <body>
    <script>
      const foods=['egg','apple','egg','egg','ham']
      function removeEgg(foods){
        const result=[]
        let count=0
        for(let i=0;i<foods.length;i++){
          if(foods[i]==='egg' && count < 2){
            count+=1
            continue
          }
          result.push(foods[i])
        }
        return result
      }
      console.log(removeEgg(foods))
    </script>
  </body>
</html>
