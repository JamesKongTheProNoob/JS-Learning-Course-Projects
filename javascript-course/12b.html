<!DOCTYPE html>
<html>
  <head>
    <title>Arrays and Loops</title>
    <style>

    </style>
  </head>
  <body>
    <script>
      let runTwice=function(fun){
        fun();
        fun();
      }
      let add=function(){
        console.log(2+3)
      }
      runTwice(function(){console.log('12b')})
      runTwice(add);

    </script>
  </body>
</html>
