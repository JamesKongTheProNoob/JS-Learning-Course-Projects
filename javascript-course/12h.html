<!DOCTYPE html>
<html>
  <head>
    <title>Arrays and Loops</title>
    <style>

    </style>
  </head>
  <body>
    <button onclick="
      messages+=1
    ">Add</button>
    <button onclick="
      messages-=1
    ">Remove</button>
    <script>
      let messages=2;
      setInterval(function(){
        if(document.querySelector('title').innerHTML==='App'){
          document.querySelector('title').innerHTML=`(${messages}) New Messages`
        }else{
          document.querySelector('title').innerHTML='App'
        }
        
      },1000)
    </script>
  </body>
</html>
