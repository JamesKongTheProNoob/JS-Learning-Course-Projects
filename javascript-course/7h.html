<!DOCTYPE html>

  <body>
    <script>
      function convertLength(length,from,to){
        if((from==='km' && to==='km' )||(from==='miles' && to==='miles')||(from==='ft' && to==='ft')){
          return length
        }else if(from==='km' && to==='miles'){
          return length/1.6
        }else if(from==='miles' && to==='km'){
          return length*1.6
        }else if(from==='miles'&& to==='ft'){
          return length*5280
        }else if(from==='km'&& to==='ft'){
          return length*3281
        }else if(from==='ft'&& to==='miles'){
          return length/5280
        }else if(from==='ft'&& to==='km'){
          return length/3281
        }else if(from!=='ft' || from!=='km' || from!=='miles'){
          return `invalid unit: ${from}`
        }else if(to!=='ft' || to!=='ft' || to!=='ft' || to!=='ft' ){
          return `invalid unit: ${to}`
        }

      }
      console.log(convertLength(50,'miles','km'),
      convertLength(32,'km','miles'),
      convertLength(50,'km','km'),
      convertLength(32,'km','miles'),
      convertLength(5,'miles','km'),
      convertLength(5,'miles','ft'),
      convertLength(5,'km','ft'),
      convertLength(5,'lbs','lbs'))
    </script>
  </body>
</html>
