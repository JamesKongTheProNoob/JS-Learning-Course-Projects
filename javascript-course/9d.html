<!DOCTYPE html>
<html>
  <head>
    
  </head>
  <body>
    <input placeholder="Name">
    <button onclick="
      submit(document.querySelector('input').value)
    ">Submit</button>
    <p></p>
    <script>
      function submit(input){
        document.querySelector('p').innerHTML=`Your name is: ${input}`
      }
    </script>
  </body>
</html>
